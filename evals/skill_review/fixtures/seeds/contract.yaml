# Contract/schema class (deterministic contract reviewer). eval_seed_cases §2.1 + S1 harvest.
- id: SEED-C1
  cls: contract
  expected_decision: veto
  expected_reviewers: [contract]
  enforcement: reviewer
  source: "_validate_frontmatter intent [E:A2]"
  rationale: "missing 'description' frontmatter field"
  writes:
    - action: create
      name: some-skill
      content: |
        ---
        name: some-skill
        ---

        Body text here.
  llm:
    skill_review_security: {kind: content, verdict: {decision: pass, severity: info, confidence: 0.9, rationale: clean}}
    skill_review_safety: {kind: content, verdict: {decision: pass, severity: info, confidence: 0.9, rationale: clean}}

- id: SEED-C2
  cls: contract
  expected_decision: veto
  expected_reviewers: [contract]
  enforcement: reviewer
  source: "content size limit [E:A2]"
  rationale: "SKILL.md over the 100k-char content cap"
  writes:
    - action: create
      name: oversized-skill
      content: |
        ---
        name: oversized-skill
        description: A skill whose body exceeds the content cap.
        ---

        Padding follows:
      filler: {field: content, chars: 100001, char: x}
  llm:
    skill_review_security: {kind: content, verdict: {decision: pass, severity: info, confidence: 0.9, rationale: clean}}
    skill_review_safety: {kind: content, verdict: {decision: pass, severity: info, confidence: 0.9, rationale: clean}}

